services:
  - type: web
    name: our-little-universe-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node node_modules/tsx/dist/cli.mjs src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_BUCKET
        value: scrapbook-media
      - key: ALLOWED_ORIGINS
        value: https://ilovenirmohi.vercel.app
